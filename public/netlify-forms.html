<!DOCTYPE html>
<html>
  <!--
    Not a real page — no links point here, it's not in the sitemap.
    @netlify/plugin-nextjs@5 no longer scans prerendered Next.js HTML for
    forms, so Netlify needs this static, build-time-detectable copy to
    register the "contact" form (see src/components/ContactForm.tsx, which
    submits to it via fetch()). Field names below must exactly match the
    `name` attributes used there.
    https://ntl.fyi/next-runtime-forms-migration
  -->
  <body>
    <form name="contact" data-netlify="true" data-netlify-honeypot="company" hidden>
      <input type="text" name="company" />
      <input type="text" name="first_name" />
      <input type="text" name="last_name" />
      <input type="email" name="email" />
      <input type="tel" name="mobile" />
      <input type="text" name="destination" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="consent" />
    </form>
  </body>
</html>
